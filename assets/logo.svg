<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="100%" stop-color="#2355c9"/>
    </linearGradient>
    <linearGradient id="racketGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7c948"/>
      <stop offset="100%" stop-color="#e07b20"/>
    </linearGradient>
    <!-- Drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#00000033"/>
    </filter>
  </defs>

  <!-- ── Screen / monitor outline ── -->
  <rect x="8" y="18" width="104" height="76" rx="7" ry="7"
        fill="#1a1d2e" filter="url(#shadow)"/>
  <!-- Screen bezel inner -->
  <rect x="13" y="23" width="94" height="66" rx="4" ry="4"
        fill="#12141f"/>
  <!-- Monitor stand -->
  <rect x="50" y="94" width="20" height="7" rx="2" fill="#1a1d2e"/>
  <rect x="40" y="100" width="40" height="5" rx="3" fill="#1a1d2e"/>

  <!-- ── Dropped panel (the "shade") sliding down from top ── -->
  <rect x="13" y="23" width="94" height="30" rx="4" ry="4"
        fill="url(#panelGrad)" opacity="0.93"/>
  <!-- Panel bottom edge highlight -->
  <rect x="13" y="51" width="94" height="2" rx="1"
        fill="#7ab0ff" opacity="0.5"/>
  <!-- Three app icon placeholders in the panel -->
  <rect x="24" y="30" width="16" height="16" rx="3" fill="#ffffff22"/>
  <rect x="52" y="30" width="16" height="16" rx="3" fill="#ffffff22"/>
  <rect x="80" y="30" width="16" height="16" rx="3" fill="#ffffff22"/>

  <!-- ── Racket head (oval string bed) ── -->
  <ellipse cx="84" cy="72" rx="18" ry="14"
           fill="none" stroke="url(#racketGrad)" stroke-width="3.5"
           filter="url(#shadow)"/>
  <!-- String lines horizontal -->
  <line x1="67" y1="68" x2="101" y2="68" stroke="#f7c94888" stroke-width="1"/>
  <line x1="66" y1="72" x2="102" y2="72" stroke="#f7c94888" stroke-width="1"/>
  <line x1="67" y1="76" x2="101" y2="76" stroke="#f7c94888" stroke-width="1"/>
  <!-- String lines vertical -->
  <line x1="78" y1="59" x2="78" y2="85" stroke="#f7c94888" stroke-width="1"/>
  <line x1="84" y1="58" x2="84" y2="86" stroke="#f7c94888" stroke-width="1"/>
  <line x1="90" y1="59" x2="90" y2="85" stroke="#f7c94888" stroke-width="1"/>
  <!-- Racket handle -->
  <line x1="73" y1="83" x2="62" y2="96" stroke="url(#racketGrad)"
        stroke-width="4" stroke-linecap="round"/>
  <!-- Handle grip wrap -->
  <line x1="71" y1="86" x2="63" y2="94" stroke="#e07b2066"
        stroke-width="6" stroke-linecap="round"/>

  <!-- ── Ball dropping toward the net ── -->
  <!-- Motion trail -->
  <circle cx="84" cy="58" r="3.5" fill="#ffffff18"/>
  <circle cx="84" cy="52" r="2.5" fill="#ffffff10"/>
  <!-- Ball -->
  <circle cx="84" cy="64" r="5" fill="#c8f74f" filter="url(#shadow)"/>
  <!-- Ball seam -->
  <path d="M80.5 62 Q84 65 87.5 62" fill="none" stroke="#88b030" stroke-width="1" stroke-linecap="round"/>

</svg>
