name: Build Installers

# Trigger on releases and on every push to master (temporary — for testing only).
on:
  release:
    types: [published]
  push:
    branches:
      - master   # TODO: remove this trigger once CI testing is complete

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Windows installer (.msi / .exe via WiX)
  # ─────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Detect package manager and install JS dependencies
        shell: bash
        run: |
          if command -v bun &>/dev/null; then
            echo "PKG=bun" >> "$GITHUB_ENV"
            bun install
          else
            echo "PKG=npm" >> "$GITHUB_ENV"
            npm install
          fi

      - name: Build Tauri app (Windows)
        shell: bash
        run: |
          if [ "$PKG" = "bun" ]; then
            bun run tauri build --target x86_64-pc-windows-msvc
          else
            npm run tauri build --  --target x86_64-pc-windows-msvc
          fi

      - name: Collect installer artifacts
        shell: bash
        run: |
          mkdir -p bin/windows
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi  bin/windows/ 2>/dev/null || true
          cp src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe bin/windows/ 2>/dev/null || true

      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: dropshot-windows
          path: bin/windows/
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: bin/windows/*

  # ─────────────────────────────────────────────────────────────────
  # Linux installer (.flatpak via flatpak-builder)
  # ─────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux Installer
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf \
            flatpak \
            flatpak-builder

      - name: Install Freedesktop SDK/Platform runtimes
        run: |
          flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: linux-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Detect package manager and install JS dependencies
        run: |
          if command -v bun &>/dev/null; then
            echo "PKG=bun" >> "$GITHUB_ENV"
            bun install
          else
            echo "PKG=npm" >> "$GITHUB_ENV"
            npm install
          fi

      - name: Build Tauri app (Linux)
        run: |
          if [ "$PKG" = "bun" ]; then
            bun run tauri build --target x86_64-unknown-linux-gnu
          else
            npm run tauri build -- --target x86_64-unknown-linux-gnu
          fi

      - name: Collect raw bundle artifacts
        run: |
          mkdir -p bin/linux
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage bin/linux/ 2>/dev/null || true
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb           bin/linux/ 2>/dev/null || true
          cp src-tauri/target/x86_64-unknown-linux-gnu/release/dropshot                   bin/linux/dropshot 2>/dev/null || true

      - name: Build Flatpak installer
        run: |
          mkdir -p install/linux
          flatpak-builder --force-clean \
            --repo=install/linux/repo \
            install/linux/build \
            src/installers/linux/com.dropshot.app.yml
          flatpak build-bundle install/linux/repo \
            install/linux/dropshot.flatpak \
            com.dropshot.app

      - name: Upload Linux installers
        uses: actions/upload-artifact@v4
        with:
          name: dropshot-linux
          path: |
            install/linux/dropshot.flatpak
            bin/linux/*.AppImage
            bin/linux/*.deb
          if-no-files-found: warn

      - name: Attach to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            install/linux/dropshot.flatpak
            bin/linux/*.AppImage
            bin/linux/*.deb
